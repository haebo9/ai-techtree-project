upstream frontend_upstream {
    server frontend:8100;
}

upstream backend_upstream {
    server backend:8000;
}

upstream langgraph_upstream {
    server langgraph:2024;
}

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name techtree.haebo.pro localhost;

    # 1. Block malicious bot IP
    deny 34.66.133.48;

    # 2. Security: Block malicious scanner patterns
    # But ALLOW legitimate Streamlit components and root static files
    location ~* ^/(proc|9|%|php|wp-|admin|login|config|shell|setup|punctuation|w3o|evening|morning|punct|cancel|&|-) {
        access_log off;
        log_not_found off;
        return 444;
    }

    # SSL Certification (Certbot) - Renewal path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server
server {
    listen 443 ssl;
    server_name techtree.haebo.pro;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/techtree.haebo.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techtree.haebo.pro/privkey.pem;

    # 1. Block malicious bot IP
    deny 34.66.133.48;

    # 2. Security: Block malicious scanner patterns
    location ~* ^/(proc|9|%|php|wp-|admin|login|config|shell|setup|punctuation|w3o|evening|morning|punct|cancel|&|-) {
        access_log off;
        log_not_found off;
        return 444;
    }
    
    # SSL Tuning (Best Practices)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # 1. Frontend (Root)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. Frontend Streamlit WebSocket
    location /_stcore/stream {
        proxy_pass http://frontend_upstream/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # 3. Backend API (FastAPI)
    location /api {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. LangGraph Agent API (for Chat/Quiz logic)
    location /threads/ {
        proxy_pass http://langgraph_upstream/threads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
