services:
  # 1. Backend Server (FastAPI)
  backend:
    image: haebo/ai-techtree:v1.1
    container_name: ai-techtree-backend-v1.1
    # PYTHONPATH가 /app/backend 이므로, app.main:app 으로 시작해야 함
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env # 모든 Key (OpenAI, Mongo 등)는 백엔드에만 있으면 됨!
    environment:
      - PYTHONPATH=/app/backend
  # 2. Frontend Interface (Streamlit)
  frontend:
    image: haebo/ai-techtree:v1.1
    container_name: ai-techtree-frontend-v1.1
    command: streamlit run backend/streamlit_dashboard.py --server.port 8100
    ports:
      - "8100:8100"
    environment:
      - PYTHONPATH=/app
      - BACKEND_URL=http://backend:8000
      - LANGGRAPH_API_URL=http://langgraph:2024
    depends_on:
      - backend
      - langgraph

  # 3. LangGraph Server (Graph Execution Logic)
  langgraph:
    image: haebo/ai-techtree:v1.1
    container_name: ai-techtree-langgraph-v1.1
    command: langgraph dev --host 0.0.0.0 --port 2024
    ports:
      - "2024:2024"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/backend
    depends_on:
      - backend
  # 4. MCP Server (Agent Interface)
  mcp:
    image: haebo/ai-techtree:v1.1
    container_name: ai-techtree-mcp-v1.1
    # SSE Transport mode on port 8200 (Forced by sys.argv injection in mcp_server.py)
    command: python -m app.interfaces.mcp.server
    ports:
      - "8200:8200"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/backend
    depends_on:
      - backend

  # 5. Nginx Reverse Proxy (Gateway)
  nginx:
    image: nginx:latest
    container_name: ai-techtree-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
      - langgraph
      - mcp
    restart: always

  # 5. Certbot (SSL Certificate Manager)
  certbot:
    image: certbot/certbot
    container_name: ai-techtree-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

## For AWS
# $ docker build --no-cache --platform linux/amd64 -t haebo/ai-techtree:v1.1 .
# $ docker push haebo/ai-techtree:v1.1
# $ scp -r nginx techtree-server:~/
# $ scp docker-compose.yml .env techtree-server:~/

