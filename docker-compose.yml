services:
  # 1. Backend Server (FastAPI)
  backend:
    image: haebo/ai-techtree:v1.1
    container_name: ai-techtree-backend-v1.1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app/backend
    deploy:
      resources:
        limits:
          memory: 200M
    restart: always

  # 2. Frontend Interface (Streamlit)
  frontend:
    image: haebo/ai-techtree:v1.1
    container_name: ai-techtree-frontend-v1.1
    command: streamlit run backend/streamlit_dashboard.py --server.port 8100
    expose:
      - "8100"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
      - BACKEND_URL=http://backend:8000
      - LANGGRAPH_API_URL=http://langgraph:2024
    deploy:
      resources:
        limits:
          memory: 300M
    depends_on:
      - backend
      - langgraph
    restart: always

  # 3. LangGraph Server (Graph Execution Logic)
  langgraph:
    image: haebo/ai-techtree:v1.1
    container_name: ai-techtree-langgraph-v1.1
    working_dir: /app/backend
    command: langgraph dev --host 0.0.0.0 --port 2024
    expose:
      - "2024"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app/backend
    deploy:
      resources:
        limits:
          memory: 300M
    depends_on:
      - backend
    restart: always

  # 5. Nginx Reverse Proxy (Gateway)
  nginx:
    image: nginx:latest
    container_name: ai-techtree-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    deploy:
      resources:
        limits:
          memory: 100M
    depends_on:
      - frontend
      - backend
      - langgraph
    restart: always

  # 5. Certbot (SSL Certificate Manager)
  certbot:
    image: certbot/certbot
    container_name: ai-techtree-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: always

## For AWS
# $ docker build --no-cache --platform linux/amd64 -t haebo/ai-techtree:v1.1 .
# $ docker push haebo/ai-techtree:v1.1
