services:
  # 1. Backend Server (FastAPI - Local Development)
  backend:
    build: .
    container_name: ai-techtree-backend-local
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app/backend
    volumes:
      - ./backend:/app/backend

  # # 2. Frontend Interface (Streamlit App - Port 8100)
  # frontend:
  #   build: .
  #   container_name: ai-techtree-frontend-local
  #   command: streamlit run backend/streamlit_dashboard.py --server.port 8100
  #   ports:
  #     - "8100:8100"
  #   environment:
  #     - PYTHONPATH=/app/backend
  #     - BACKEND_URL=http://backend:8000
  #     - LANGGRAPH_API_URL=http://langgraph:2024
  #   depends_on:
  #     - backend
  #     - langgraph
  #   volumes:
  #     - ./backend:/app/backend

  # 2.5 LangGraph Server (Graph Execution Logic)
  langgraph:
    build: .
    container_name: ai-techtree-langgraph-local
    command: langgraph dev --host 0.0.0.0 --port 2024
    ports:
      - "2024:2024"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app/backend
    volumes:
      - ./backend:/app/backend
    depends_on:
      - backend

  # 4. Nginx Reverse Proxy (Gateway)
  nginx:
    image: nginx:latest
    container_name: ai-techtree-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: always

