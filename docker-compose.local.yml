services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: techtree-backend-local
    env_file:
      - ./backend/.env.local
    environment:
      PYTHONPATH: /app/backend
      PYTHONUNBUFFERED: "1"
      APP_ENV: LOCAL
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        BACKEND_INTERNAL_URL: http://backend:8000
    container_name: techtree-frontend-local
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: /api
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: techtree-nginx-local
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
